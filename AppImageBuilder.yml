version: 1

AppDir:
  path: ./AppDir
  app_info:
    exec: usr/bin/python3
    exec_args: "$APPDIR/usr/share/cachy-kernel-updater/main.py $@"
    id: org.cachyos.debian.kernelupdater
    name: Cachy-Kernel-Updater
    icon: org.cachyos.debian.kernelupdater
    version: 1.0.4

  apt:
    arch: amd64
    allow_unauthenticated: true
    sources:
      - sourceline: 'deb [arch=amd64] http://deb.debian.org/debian/ bookworm main'
      - sourceline: 'deb [arch=amd64] http://deb.debian.org/debian-security/ bookworm-security main'
    include:
      - python3
      - python3-gi
      - python3-gi-cairo
      - python3-requests
      - gir1.2-gtk-4.0
      - gir1.2-adw-1
      - libgtk-4-1
      - libadwaita-1-0
      - adwaita-icon-theme
      - hicolor-icon-theme
      - gsettings-desktop-schemas
    exclude:
      - dpkg
      - apt

  files:
    include: []
    exclude:
      - usr/share/man
      - usr/share/doc/*/README.*
      - usr/share/doc/*/changelog.*
      - usr/share/doc/*/copyright
      - usr/share/doc/*/changelog.Debian.*

  runtime:
    env:
      APPDIR_LIBRARY_PATH: "$APPDIR/usr/lib/x86_64-linux-gnu:$APPDIR/usr/lib"
      GI_TYPELIB_PATH: "$APPDIR/usr/lib/x86_64-linux-gnu/girepository-1.0:$APPDIR/usr/lib/girepository-1.0"
      PYTHONPATH: "$APPDIR/usr/share/cachy-kernel-updater"
      XDG_DATA_DIRS: "$APPDIR/usr/share:${XDG_DATA_DIRS:-/usr/local/share:/usr/share}"
      GSETTINGS_SCHEMA_DIR: "$APPDIR/usr/share/glib-2.0/schemas"

AppImage:
  update-information: None
  sign-key: None
  arch: x86_64
